
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            text-align: center;
            color: #2d6a4f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #2d6a4f;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Danh sách sản phẩm</h1>

    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Áo thun</td>
            <td>150.000 VNĐ</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Quần jeans</td>
            <td>350.000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Giày thể thao</td>
            <td>600.000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Balo</td>
            <td>250.000 VNĐ</td>
            <td>12</td>
        </tr>
    </table>
</body>
</html>
